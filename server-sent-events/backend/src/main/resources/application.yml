server:
  port: 8080

spring:
  application:
    name: sse-demo-backend
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Configurações de internacionalização
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600
    fallback-to-system-locale: false
    always-use-message-format: false

  # Configuração de locale - SEMPRE inglês por padrão
  web:
    locale: en
    locale-resolver: session

# SpringDoc OpenAPI 3 Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    disable-swagger-default-url: true
    display-request-duration: true
    default-models-expand-depth: 2
    default-model-expand-depth: 2
  show-actuator: false
  group-configs:
    - group: 'sse-demo-api'
      display-name: 'SSE Demo API'
      paths-to-match: '/api/**'

# Configurações de agendamento
scheduling:
  enabled: true

# Configuração customizada da aplicação
app:
  i18n:
    default-locale: en
    supported-locales: en,pt,es,it
    require-explicit-lang-param: true

logging:
  level:
    com.example.ssedemo: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.context.support: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"