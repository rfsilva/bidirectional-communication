# Configuração para desenvolvimento local
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sse_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: sse_user
    password: sse_password
    
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  flyway:
    enabled: true
    clean-disabled: false # Permitido em desenvolvimento
    
logging:
  level:
    com.example.ssedemo: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG