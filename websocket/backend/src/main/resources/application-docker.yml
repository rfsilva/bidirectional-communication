# Configuração específica para ambiente Docker
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/sse_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: sse_user
    password: sse_password
    
  jpa:
    show-sql: false # Desabilitado em container para performance
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    
logging:
  level:
    com.example.ssedemo: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  file:
    name: /app/logs/sse-demo.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"