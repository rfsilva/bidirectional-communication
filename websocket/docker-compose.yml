version: '3.8'

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: websocket-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: websocket_demo
      MYSQL_USER: websocket_user
      MYSQL_PASSWORD: websocket_password
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - websocket-demo-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+00:00'
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --bind-address=0.0.0.0
      --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "websocket_user", "-pwebsocket_password"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

